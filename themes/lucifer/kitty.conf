font_family ComicCodeLigatures Nerd Font

background_opacity 0.85
dynamic_background_opacity yes
window_padding_width 16
inactive_text_alpha 0.9
cursor_shape beam
cursor_blink_interval 0
font_size 12.0

confirm_os_window_close 0

map ctrl+shift+t launch --cwd=current --type=tab
map ctrl+w close_tab

map ctrl+shift+a previous_tab
map ctrl+shift+d next_tab

tab_bar_min_tabs    1
tab_bar_edge        top
tab_bar_style       separator
tab_separator "   "
tab_title_template " {index}: {title} "

foreground #f7edf0
background #201820
selection_foreground #201820
selection_background #ff5364
cursor #ff5364
cursor_text_color #201820
url_color #ff5364
active_border_color #ff5364
inactive_border_color #634555
bell_border_color #ff6470
wayland_titlebar_color background
active_tab_foreground #201820
active_tab_background #ff5364
inactive_tab_foreground #d0bdc6
inactive_tab_background #292029
tab_bar_background #201820
color0 #201820
color1 #ff5364
color2 #a6da95
color3 #eed49f
color4 #8aadf4
color5 #c6a0f6
color6 #8bd5ca
color7 #d6cabe
color8 #b7a6b0
color9 #e99aa3
color10 #c1e6aa
color11 #f6dfb4
color12 #abc6f7
