env = XCURSOR_THEME,catppuccin-macchiato-red-cursors
env = HYPRCURSOR_THEME,catppuccin-macchiato-red-cursors
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 7
    gaps_out = 18
    border_size = 3
    col.active_border = rgba(f32746ff) rgba(580f28ff) rgba(ff9aa4ff) rgba(a01632ff) 45deg
    col.inactive_border = rgba(48212ddd)
    allow_tearing = false
    layout = dwindle
}
decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    shadow {
        enabled = true
        range = 34
        render_power = 3
        color = rgba(950c2845)
    }
    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.08
    }
}

windowrule = match:class ^(kitty)$, opacity 1.0 override 1.0 override 1.0 override
windowrule = match:class ^(firefox)$, opacity 1.0 override 1.0 override 1.0 override
layerrule = match:namespace ^dms:.*, blur on, ignore_alpha 0.2
