exec-once = systemctl --user start theme-shell.service
exec-once = udiskie
exec-once = hypr-layout-notify

bind = SUPER CTRL, W, exec, theme-motion-toggle
bind = SUPER SHIFT, V, exec, dms ipc call clipboard toggle
bind = SUPER SHIFT, N, exec, dms ipc call notifications toggle

exec-once = lucifer-smoke-mode auto
windowrule = match:class .*, tag +shader_close_default:/etc/nixos/themes/lucifer/supernatural/close/demon-close.glsl
