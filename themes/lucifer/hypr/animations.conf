animations {
    enabled = yes
    bezier = descend, 0.16, 1, 0.3, 1
    bezier = vanish, 0.7, 0, 0.84, 0
    bezier = glide, 0.65, 0, 0.35, 1
    animation = windowsIn, 1, 5, descend, popin 78%
    animation = windowsOut, 1, 3, vanish, popin 100%
    animation = windowsMove, 1, 5, descend
    animation = border, 1, 8, default
    animation = borderangle, 1, 90, linear, loop
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, glide, slidefade 20%
    animation = specialWorkspace, 1, 5, descend, slidefadevert 15%
    animation = layersIn, 1, 4, descend, slide
    animation = layersOut, 1, 3, vanish, fade
}

layerrule = no_anim on, match:namespace ^(selection|hyprpicker)$
