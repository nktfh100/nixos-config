source = ~/.config/hypr/variables.conf
source = ~/.config/hypr/environment.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/look.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/profile.conf
source = ~/.config/hypr/hosts/$HOSTNAME.conf

monitor = ,preferred,auto,auto

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^$ title ^$ xwayland 1 floating 1 fullscreen 0 pinned 0, no_focus on
windowrule = match:class ^(code)$, workspace special:DEV
